# Contoh blok untuk situs venbeemail.com di aaPanel (Website → venbeemail.com → Config),
# kalau kamu memilih menulis sendiri alih-alih memakai menu "Reverse proxy".
# Taruh di dalam blok server { ... } yang sudah dibuat aaPanel (yang listen 443 + SSL).
location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 64k;
}
