# BanaMail — satu Worker untuk semuanya:
#   • email()     menerima surat untuk *@venbeemail.com (Cloudflare Email Routing, catch-all → Worker ini)
#   • fetch()     melayani /api/* ; file lain (halaman BanaMail) dilayani dari [assets]
#   • scheduled() tiap 10 menit menghapus alamat kedaluwarsa beserta isinya
# Panduan setup lengkap: worker/README.md
name = "banamail"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Domain kustom: venbeemail.com → Worker ini (halaman + API). Dikomentari supaya `wrangler dev`
# lokal tidak butuh akun; aktifkan sebelum `npm run deploy`.
# routes = [{ pattern = "venbeemail.com", custom_domain = true }]

# Halaman BanaMail (public/banamail) dilayani langsung oleh Worker ini di "/".
[assets]
directory = "../public/banamail"

[vars]
DOMAINS = "venbeemail.com"        # pisahkan dengan koma kalau lebih dari satu
TTL_MINUTES = "60"                # umur alamat
RANDOM_LENGTH = "10"              # nama acak, mis. ifhew8883d
SUFFIX_LENGTH = "6"               # akhiran acak untuk nama kustom, mis. budi.k7m2x9
MAX_MESSAGE_BYTES = "20971520"    # surat > 20 MB ditolak
NEW_ADDRESS_LIMIT = "20"          # alamat baru per IP per 10 menit
SENDING_ENABLED = "false"         # fitur Balas belum aktif (butuh layanan pengirim, lihat README)

[[d1_databases]]
binding = "DB"
database_name = "banamail"
database_id = "00000000-0000-0000-0000-000000000000" # ganti dengan id dari `npx wrangler d1 create banamail`
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MAIL"
bucket_name = "banamail-mail"

[triggers]
crons = ["*/10 * * * *"]

[observability]
enabled = true
